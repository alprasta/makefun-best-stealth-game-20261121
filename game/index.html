<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOTHLIGHT — A Quiet Heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b12; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #0c1420; box-shadow: 0 0 60px rgba(0,0,0,.8); }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="480" aria-label="MOTHLIGHT, a top-down stealth game: sneak past the lantern wardens, gather the moonpetals, and slip out the moon gate unseen"></canvas></div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./game.js"></script>
</body>
</html>
